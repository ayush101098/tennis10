[build]
  base = "trading-terminal"
  publish = "out"
  # Next's `output: export` cannot include the app-router API route (it has no
  # generateStaticParams and proxies live data) — Netlify serves that same
  # path via the sofa-proxy function + redirect below instead, so the route
  # is only needed for local `next dev`. Strip it before the static build.
  command = "rm -rf src/app/api && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Functions directory for serverless functions (SofaScore proxy etc.)
[functions]
  directory = "netlify/functions"

# The OG card is emitted by the export as an extensionless file, which Netlify
# serves as text/plain — X, Telegram and Slack all reject that and show no
# preview at all. Declare the real type.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

# Route SofaScore API requests through the serverless function
[[redirects]]
  from = "/api/sofa/*"
  to = "/.netlify/functions/sofa-proxy/:splat"
  status = 200
  force = true

# ESPN scoreboard. ESPN now 403s browser-shaped requests and a 403 carries no
# CORS headers, so the direct browser fetch failed and the board rendered empty
# for everyone. Proxied server-side instead. See netlify/functions/espn-proxy.js
[[redirects]]
  from = "/api/espn/*"
  to = "/.netlify/functions/espn-proxy/:splat"
  status = 200
  force = true

# Polymarket. Without this the static export has no /api/pm/* at all and
# lib/polymarket.ts falls back to calling gamma-api from the BROWSER — one
# upstream connection per visitor, refreshing forever. See pm-proxy.js.
[[redirects]]
  from = "/api/pm/*"
  to = "/.netlify/functions/pm-proxy/:splat"
  status = 200
  force = true

# Live-presence counter (the static export strips the /api/presence route)
[[redirects]]
  from = "/api/presence"
  to = "/.netlify/functions/presence"
  status = 200
  force = true

# Email capture + payment ledger (static export strips the /api/subscribe route)
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# First-party pageview tracking (static export strips the /api/track route)
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

# Authoritative payment verification + entitlement (server-side source of truth)
[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200
  force = true

# Google Sign-In: verifies the ID token server-side (a client-side check would
# be worthless — anyone can post any email).
[[redirects]]
  from = "/api/google-auth"
  to = "/.netlify/functions/google-auth"
  status = 200
  force = true

# Account database — logins, payments and grants in one store
[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200
  force = true

# Stripe card payments: start checkout, confirm the return, receive webhooks.
[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/confirm"
  to = "/.netlify/functions/stripe-confirm"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# PayPal — international / US cards (guest card checkout, no PayPal account needed)
[[redirects]]
  from = "/api/paypal"
  to = "/.netlify/functions/paypal"
  status = 200
  force = true

# Razorpay — India: UPI, netbanking, cards, wallets
[[redirects]]
  from = "/api/razorpay"
  to = "/.netlify/functions/razorpay"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay/webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
