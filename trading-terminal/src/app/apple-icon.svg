<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Browser-tab icon. A deliberately simplified TA: the dial rings and the
    circular lettering of the full mark turn to mush at 16px, so the tab keeps
    only the monogram on the site's own dark, which stays legible next to a
    dozen other tabs.
  -->
