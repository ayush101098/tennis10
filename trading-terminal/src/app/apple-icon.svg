  <rect x="20" y="30" width="40" height="7" rx="1.5" fill="#F1F5F9"/>
  <rect x="37" y="30" width="7"  height="40" rx="1.5" fill="#F1F5F9"/>
  <path d="M56 70 L67 34 L73 34 L84 70 L76 70 L70 49 L64 70 Z" fill="#22c55e"/>
</svg>
