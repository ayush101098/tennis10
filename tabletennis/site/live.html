<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TT Predictor — LIVE</title>
<style>
:root{--bg:#111417;--panel:#191e23;--panel2:#20262c;--edge:#2b333b;--ink:#e8eaec;
  --mut:#8a939c;--faint:#5a636c;--accent:#ff7a3c;--p1:#4fb477;--p2:#d9584b;--warn:#e0a03a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--edge);padding-bottom:14px}
h1{font-size:17px;margin:0}h1 b{color:var(--accent)}
a{color:var(--mut);font-size:11px;text-decoration:none}a:hover{color:var(--ink)}
.gen{margin-left:auto;color:var(--faint);font-size:11px}
.live-dot{color:var(--p2);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.live-dot{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px}
.top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}
.names{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 2px;gap:10px}
.names b{font-size:14px}
.score{font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
.probline{display:flex;justify-content:space-between;font-size:12px;margin:4px 0 8px}
.probline .a{color:var(--p1);font-weight:700}.probline .b{color:var(--p2);font-weight:700}
canvas{width:100%;height:110px;display:block;background:var(--panel2);
  border:1px solid var(--edge);border-radius:6px}
.ann{margin-top:8px;font-size:10.5px;color:var(--warn)}
.meta{margin-top:6px;font-size:10px;color:var(--faint)}
.err{color:var(--p2);padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏓 <b>TT LIVE</b> <span class="live-dot">●</span> in-play win probability</h1>
    <a href="index.html">← today's board</a>
    <span class="gen" id="gen"></span>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script>
const $=id=>document.getElementById(id);

function chart(cv, hist, pre){
  const ctx=cv.getContext("2d"), W=cv.width=cv.offsetWidth*2, H=cv.height=220;
  ctx.clearRect(0,0,W,H);
  // grid: 25/50/75 lines
  ctx.strokeStyle="#2b333b"; ctx.lineWidth=1; ctx.setLineDash([4,5]);
  [0.25,0.5,0.75].forEach(v=>{const y=H-v*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()});
  ctx.setLineDash([]);
  const pts=[[0,pre],...hist.map((h,i)=>[i+1,h[1]])];
  if(pts.length<2)return;
  const xs=i=>i/(pts.length-1)*(W-16)+8, ys=p=>H-8-p*(H-16);
  // area fill
  ctx.beginPath();ctx.moveTo(xs(0),ys(pts[0][1]));
  pts.forEach((p,i)=>ctx.lineTo(xs(i),ys(p[1])));
  ctx.lineTo(xs(pts.length-1),H);ctx.lineTo(xs(0),H);ctx.closePath();
  ctx.fillStyle="rgba(79,180,119,.10)";ctx.fill();
  // line
  ctx.beginPath();ctx.moveTo(xs(0),ys(pts[0][1]));
  pts.forEach((p,i)=>ctx.lineTo(xs(i),ys(p[1])));
  ctx.strokeStyle="#4fb477";ctx.lineWidth=3;ctx.stroke();
  // endpoint
  const last=pts[pts.length-1];
  ctx.beginPath();ctx.arc(xs(pts.length-1),ys(last[1]),5,0,7);
  ctx.fillStyle="#ff7a3c";ctx.fill();
}

function render(d){
  $("gen").textContent="updated "+new Date(d.generated_ts*1000).toLocaleTimeString();
  const g=$("grid");
  if(!d.matches.length){g.innerHTML='<div class="err">no live matches right now</div>';return}
  g.innerHTML=d.matches.map((m,i)=>`
    <div class="card">
      <div class="top"><span>${m.category} · ${(m.tournament||"").slice(0,34)}</span>
        <span>Bo${m.best_of}</span></div>
      <div class="names">
        <b>${m.p1}</b>
        <span class="score num">${m.games[0]}–${m.games[1]} <small>(${m.points[0]}–${m.points[1]})</small></span>
        <b>${m.p2}</b>
      </div>
      <div class="probline">
        <span class="a num">${(m.p1_win*100).toFixed(1)}%</span>
        <span class="num" style="color:var(--faint)">analytic ${(m.analytic_p1*100).toFixed(1)}% · pre ${(m.pre_match_p1*100).toFixed(0)}%</span>
        <span class="b num">${((1-m.p1_win)*100).toFixed(1)}%</span>
      </div>
      <canvas id="cv${i}"></canvas>
      ${m.annotation?`<div class="ann">⚡ ${m.annotation}</div>`:""}
      <div class="meta">chart: P(${m.p1} wins) per state change · residual ${(m.residual*100).toFixed(1)}pp</div>
    </div>`).join("");
  d.matches.forEach((m,i)=>chart($("cv"+i),m.history,m.pre_match_p1));
}

async function tick(){
  try{
    const r=await fetch("live_predictions.json?t="+Date.now());
    if(r.ok)render(await r.json());
  }catch(e){}
}
tick();setInterval(tick,10000);
</script>
</body>
</html>
